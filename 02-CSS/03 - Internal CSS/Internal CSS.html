<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal CSS</title>
    <style>
      h1 {
        color: red;
        font-family: Arial, sans-serif;
        margin: auto;
        text-align: center;
      }
      div {
        color: #555;
        font-family: Arial, sans-serif;
        margin: auto;
        text-align: center;
      }
      span {
        color: blue;
        font-family: Arial, sans-serif;
        margin: auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Internal CSS</h1>
    <div>
      <p>This is a paragraph inside the div. and span <span>Span 1</span></p>
    </div>

    <span>This is a paragraph inside the span. and div <div>Div 1</div></span>
  </body>
</html>
