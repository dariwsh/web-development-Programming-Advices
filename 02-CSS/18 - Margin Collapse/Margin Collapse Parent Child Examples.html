<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Collapse</title>
    <link rel="stylesheet" href="Margin Collapse.css">
    <style>
        .parent {
            margin: 20px 40px;
            padding: 10px;
            border: 1px solid #a92121;
        }
        .parent p {
            margin: 20px ;
            padding: 10px;
            border: 1px solid #21a921;
        }
    </style>
</head>
<body>
    <h1>Margin Collapse : Adjacent Siblings</h1>
     <h1>Parent-Child Margin Collapse</h1>
  <div class="parent">
    <p>The top margin of this paragraph may collapse with the parent's top margin, reducing the overall space.</p>
    <p>Similarly, the bottom margin may collapse with the parent's bottom margin.</p>
  </div>
</body>
</html>
