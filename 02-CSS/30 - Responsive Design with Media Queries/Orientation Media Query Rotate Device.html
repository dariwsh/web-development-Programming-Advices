<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        transition: background 0.3s;
      }
      /* Default: landscape or desktop */
      body {
        background: lightblue;
      }
      .bo {
        color: aliceblue;
      }
     @media screen and (orientation: portrait) {
      body {
        background: lightcoral;
      }
    }
    </style>
  </head>
  <body>
    <div class="bo">
      <h1>Rotate Your Device</h1>
      <p>Background becomes lightcoral in portrait, lightblue otherwise.</p>
    </div>
  </body>
</html>
