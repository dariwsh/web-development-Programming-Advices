<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Height, Width, and Max-Width</title>
    <link rel="stylesheet" href="CSS Height Width and Max-Width.css" />
    <style>
      .par {
        width: 900px;
        height: 800px;
      }
      .box {
        text-align: center;
    
        width: 90%;
        max-width: 500px;
        height: 300px;
        margin: auto auto;
        padding: 20px;
        border: 1px solid red;
        box-sizing: border-box;
      }
      
    </style>
  </head>
  <body>
    <h1>CSS Height, Width, and Max-Width</h1>
    <div class="par">
      <div class="box">
        <h1>hello</h1>
      </div>
    </div>
  </body>
</html>
