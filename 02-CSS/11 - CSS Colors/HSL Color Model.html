<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="HSL Color Styles.css" />
    <title>Document</title>
    <style>
      body {
        background-color: hsl(240, 30%, 95%); /* لون فاتح */
      }
      div {
        background-color: hsl(240, 30%, 80%); /* أقل Saturation */
        padding: 20px;
        border-radius: 10px;
      }
      h1 {
        color: hsl(240, 100%, 50%);
        text-align: center;
      }
      p {
        color: hsl(240, 100%, 70%); /* أفتح */
      }
    </style>
  </head>
  <body>
    <div>
      <h1>HSL Color Model</h1>
      <p>This is a simple example of using HSL colors in CSS.</p>
    </div>
  </body>
</html>
