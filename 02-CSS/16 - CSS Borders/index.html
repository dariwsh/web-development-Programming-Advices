<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders</title>
    <link rel="stylesheet" href="style.css">
    <style>
        div
        {
            border: 2px solid rgb(224, 31, 31);
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
        }
        p
        {
            border: 3px double rgb(83, 209, 83);
            border-radius: 10px;
        }
        button
        {
           border-style: dashed;
           border-width: 4px;
              border-color: rgb(31, 31, 224);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div>
        <p>CSS borders are used to define the edges of an element. You can customize the border's width, style, and color using CSS properties.</p>
        <button>Click Me</button>
    </div>
</body>
</html>
