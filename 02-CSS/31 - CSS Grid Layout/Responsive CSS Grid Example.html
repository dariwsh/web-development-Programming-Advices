<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout</title>
    <link rel="stylesheet" href="CSS Grid Layout.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 1rem;
      }
      .main {
        display: grid; /* Switches the element from block/inline flow  
    to a two-dimensional grid context. */

        /* 2️⃣ Define Columns */
        grid-template-columns: 1fr 2fr 1fr;
        /* Three fixed columns, each exactly 100 px wide. */
        /* grid-template-Rows:100px 100px 100px 100px;  auto */
        /* 3️⃣ Set Space Between Cells */
        gap: 10px; /* Creates a 10 px gutter between all rows & cols,  
  keeping content neatly separated. */
      }

      .item {
        background: #ace;
        padding: 1rem;
        text-align: center;
        border-radius: 40px;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Fixed Grid Example</h1>
    <div class="main">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
      <div class="item">7</div>
      <div class="item">8</div>
    </div>
  </body>
</html>
