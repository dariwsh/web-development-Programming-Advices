<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>em</title>

    <style>
        body
        {
            font-size:16px;
        }
        .parent
        {
            font-size:1.5em; /* 1.5 * 16px = 24px */
        }
        .child
        {
            font-size:1.5em; /* 1.5 * 24px = 36px */
        }

      /* rem */
      .REM
      {
          font-size:1.5rem; /* 1.5 * 16px = 24px */
          background-color: #b37777;
          color: #542626;
      }
      .parentrem
      {
        font-size:1.5rem; /* 1.5 * 16px = 24px */
        background-color: #d76161;
      }
      .childrem
      {
        font-size:1.5rem; /* 1.5` * 16px = 24px */
        background-color: #d42c2c;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      Parent text is 24px.
      <div class="child">Child text is 36px.</div>
    </div>

    <div class = "REM">
      <p>REM is relative to the root element (html). The root element font-size is 16px.</p>
      <div class="parentrem">
        Parent text is 24px.
        <div class="childrem">Child text is 24px.</div>
      </div>
    </div>
  </body>
</html>
