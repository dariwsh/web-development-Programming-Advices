<!DOCTYPE html>
<html>
<head>
  <style>
    html { font-size: 16px; }      /* 1rem = 16px */
    h2   { font-size: 2rem; }      /* 32px */
    p    { font-size: 0.75rem; }  /* 12px [75% of 16px] */
  </style>
</head>
<body>
  <h2>Heading at 2rem (32px)</h2>
  <p>Paragraph at 0.75rem (12px).</p>
</body>
</html>
