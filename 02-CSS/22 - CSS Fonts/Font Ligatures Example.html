<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Ligatures Example</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'EB Garamond', serif;
      font-size: 24px;
      line-height: 2;
      padding: 20px;
    }

    .no-ligatures {
      font-variant-ligatures: none;
    }

    .common-ligatures {
      font-variant-ligatures: common-ligatures;
    }

    .fancy-ligatures {
      font-variant-ligatures: discretionary-ligatures historical-ligatures;
    }

    h2 {
      margin-top: 40px;
      font-size: 20px;
    }

    .box {
      padding: 10px;
      background: #f3f3f3;
      border-left: 5px solid #888;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>✨ Font Ligatures Demo</h1>

  <h2>No Ligatures</h2>
  <div class="box no-ligatures">
    office • affluent • flexible • official • affiliate
  </div>

  <h2>Common Ligatures</h2>
  <div class="box common-ligatures">
    office • affluent • flexible • official • affiliate
  </div>

  <h2>Discretionary + Historical Ligatures (if available)</h2>
  <div class="box fancy-ligatures">
    office • affluent • flexible • official • affiliate
  </div>

</body>
</html>
