<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .normal {
        font-style: normal;
      }
      .italic {
        font-style: italic;
      }
      .oblique {
        font-style: oblique;
      }
      .angle {
        font-style: oblique 15deg; /* Custom slant */
      }
    </style>
  </head>
  <body>
    <p class="normal">This is <strong>normal</strong> text.</p>
    <p class="italic">This is <strong>italic</strong> text.</p>
    <p class="oblique">This is <strong>oblique</strong> text.</p>
    <p class="angle">This is <strong>oblique 15deg</strong> text.</p>
  </body>
</html>
